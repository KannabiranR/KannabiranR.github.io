<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kannabiran Ramadass | Portfolio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Base Variables & Theme */
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent-blue: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --max-width: 1140px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Navigation Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-container {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        nav ul a {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        nav ul a:hover {
            color: var(--accent-blue);
        }

        /* Global Sections Layout */
        section {
            padding: 5rem 1rem 3rem 1rem;
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 40px;
            height: 3px;
            background-color: var(--accent-blue);
        }

        /* Hero / Profile Presentation */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 85vh;
            padding-top: 7rem;
        }

        .hero h2 {
            font-size: 1.1rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin-bottom: 2rem;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s, background-color 0.3s;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: #0f172a;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background-color: #7dd3fc;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        /* Metrics / Numbers Matrix */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .metric-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }

        .metric-card h3 {
            font-size: 2.25rem;
            color: var(--accent-blue);
            margin-bottom: 0.25rem;
        }

        .metric-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Experience Section Layout */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .timeline-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .role-title {
            font-size: 1.35rem;
            font-weight: 600;
        }

        .company-meta {
            color: var(--accent-blue);
            font-weight: 500;
        }

        .duration-badge {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            padding: 0.25rem 0.75rem;
            border-radius: 30px;
            font-size: 0.85rem;
        }

        .timeline-item ul {
            list-style-type: none;
            color: var(--text-secondary);
        }

        .timeline-item ul li {
            position: relative;
            padding-left: 1.25rem;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .timeline-item ul li::before {
            content: "▹";
            position: absolute;
            left: 0;
            color: var(--accent-blue);
        }

        /* Technical Skills Groups */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .skills-category {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 8px;
        }

        .skills-category h3 {
            font-size: 1.1rem;
            color: var(--accent-blue);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .tags-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        /* Credentials / Certificates Cards */
        .certifications-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .cert-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cert-icon {
            font-size: 2rem;
            color: var(--accent-blue);
        }

        .cert-info h4 {
            font-size: 1rem;
            font-weight: 600;
        }

        .cert-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Contact Section */
        .contact-layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 3rem;
        }

        @media (max-width: 768px) {
            .contact-layout {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            nav ul {
                display: none;
            }
            .hero h1 {
                font-size: 2.25rem;
            }
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .info-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1rem;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .info-link:hover {
            color: var(--accent-blue);
        }

        .info-link i {
            font-size: 1.25rem;
            color: var(--accent-blue);
            width: 24px;
        }

        /* Contact Interactive Form */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-color: var(--bg-card);
